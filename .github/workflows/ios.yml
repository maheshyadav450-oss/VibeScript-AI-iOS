name: Build iOS App (.ipa)
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Project
        run: |
          npm run build --if-present

      - name: Copy Capacitor Web Assets
        run: |
          npx cap copy ios

      - name: Force iOS 14.0 Target Everywhere and Install Pods
        run: |
          cd ios/App
          
          # 1. Podfile के अंदर का बेस प्लेटफॉर्म जबरन iOS 14.0 करना
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/g" Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile || true
          
          # 2. एक मास्टर स्क्रिप्ट जोड़ना जो सभी प्लगइन्स (Dependencies) का वर्जन भी iOS 14.0 कर दे
          echo "post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
          end" >> Podfile

          # 3. फ्रेश रेपो अपडेट के साथ पॉड्स इंस्टॉल करना
          pod repo update
          pod install

      - name: Build Xcode Project (Archive)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA (For Testing)
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/ || cp -r App.xcarchive/Products/Applications/*.app Payload/
          zip -r VibeScriptAI-unsigned.ipa Payload
          mv VibeScriptAI-unsigned.ipa ../../

      - name: Upload Finished IPA Asset
        uses: actions/upload-artifact@v4
        with:
          name: VibeScriptAI-iOS-Build
          path: VibeScriptAI-unsigned.ipa
