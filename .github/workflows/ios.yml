name: Build iOS App (.ipa)
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Project
        run: |
          npm run build --if-present

      - name: Copy Capacitor Web Assets
        run: |
          # बिना कोकोपॉड्स रन किए सिर्फ वेब एसेट्स को सिंक करना
          npx cap copy ios

      - name: Force iOS 14.0 Deployment Target and Install Pods
        run: |
          cd ios/App
          # Podfile के अंदर डिफ़ॉल्ट प्लेटफॉर्म को iOS 14.0 पर रिप्लेस करना
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/g" Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile || true
          
          # क्लीन पॉड इंस्टॉल रन करना
          pod install

      - name: Build Xcode Project (Archive)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA (For Testing)
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/ || cp -r App.xcarchive/Products/Applications/*.app Payload/
          zip -r VibeScriptAI-unsigned.ipa Payload
          mv VibeScriptAI-unsigned.ipa ../../

      - name: Upload Finished IPA Asset
        uses: actions/upload-artifact@v4
        with:
          name: VibeScriptAI-iOS-Build
          path: VibeScriptAI-unsigned.ipa
